<style th:fragment="css">
    :root{
        --blue:#1B3FA0; --blue-deep:#0F2870; --yellow:#FECB00;
        --ink:#101828; --muted:#5B6475; --paper:#F3F5FA; --white:#fff; --line:#DDE2EC;
        --ok:#1E8E5A; --wait:#B7791F; --c:var(--blue);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
        background:var(--paper);color:var(--ink);
        line-height:1.55;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;line-height:1.05;margin:0;letter-spacing:-.02em}
    a{color:inherit}
    :focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
    .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

    .topbar{background:var(--blue);color:#fff}
    .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
    .logo{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;text-decoration:none;letter-spacing:-.03em}
    .logo i{width:26px;height:26px;background:var(--yellow);clip-path:polygon(0 0,100% 0,0 100%)}
    .nav{display:flex;gap:6px}
    .nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px}
    .nav a:hover,.nav a[aria-current]{background:rgba(255,255,255,.16)}

    .hero{background:var(--blue);color:#fff;padding:56px 0 150px;clip-path:polygon(0 0,100% 0,100% 78%,0 100%)}
    .hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
    .hero h1{font-size:clamp(42px,6.4vw,84px);font-weight:800}
    .hero p{font-size:19px;max-width:30em;margin:22px 0 30px;color:#DCE4FF}
    .pay-card{aspect-ratio:1.586;max-width:380px;width:100%;margin-left:auto;background:var(--yellow);color:var(--ink);border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 60px -20px rgba(5,15,60,.6);transform:rotate(-6deg);animation:settle .9s cubic-bezier(.2,.8,.2,1) both}
    .pay-card .chip-ic{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#B58A00,#F1C21A 50%,#B58A00)}
    .pay-card .num{font-size:22px;font-weight:700;letter-spacing:.14em}
    .pay-card .row{display:flex;justify-content:space-between;align-items:end;font-weight:700}
    .pay-card .brand{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800}
    @keyframes settle{from{transform:rotate(-16deg) translateY(30px);opacity:0}}
    @media (prefers-reduced-motion:reduce){.pay-card{animation:none}}

    .btn{display:inline-block;white-space:nowrap;border:0;cursor:pointer;font:inherit;font-weight:700;text-decoration:none;padding:13px 22px;border-radius:12px;background:var(--blue);color:#fff;transition:transform .12s,background .12s}
    .btn:hover{background:var(--blue-deep);transform:translateY(-1px)}
    .btn.yellow{background:var(--yellow);color:var(--ink)}
    .btn.yellow:hover{background:#FFD92E}
    .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
    .btn.ghost:hover{background:var(--white)}
    .btn.block{width:100%;font-size:17px;padding:16px}

    .shop{padding:8px 24px 70px}
    .shop-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}
    .shop-head h2{font-size:34px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{font:inherit;font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--white);cursor:pointer}
    .chip:hover{border-color:var(--blue)}
    .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .tile{background:var(--white);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .15s,box-shadow .15s}
    .tile:hover{transform:translateY(-4px);box-shadow:0 18px 30px -18px rgba(16,24,40,.35)}
    .tile[hidden]{display:none}
    .tile-top{background:var(--c);color:#fff;height:128px;padding:16px 18px;display:flex;align-items:end}
    .tile-top span{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.04em;line-height:1;opacity:.92}
    .tile-body{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
    .tile-body h3{font-size:21px}
    .merchant{font-size:14px;color:var(--muted);font-weight:600}
    .desc{font-size:15px;color:var(--muted);margin:4px 0 14px}
    .buy{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .price{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em}
    .price small{font-size:15px;font-weight:700;margin-left:3px;color:var(--muted)}
    [data-cat="Kafa"]{--c:#4A2C1D}
    [data-cat="Med"]{--c:#D98A0B}
    [data-cat="Čaj"]{--c:#2F7A57}
    [data-cat="Specijaliteti"]{--c:#B83A2E}
    [data-cat="Slatkiši"]{--c:#B84A7E}

    .page{padding:44px 0 70px}
    .page h1{font-size:clamp(34px,5vw,52px);margin-bottom:8px}
    .lead{color:var(--muted);font-size:17px;max-width:40em;margin:0 0 28px}
    .panel{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:28px}

    .checkout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    .summary{padding:0;overflow:hidden}
    .summary .tile-top{height:150px}
    .summary .inner{padding:24px;display:grid;gap:14px}
    .summary h2{font-size:28px}
    .line{display:flex;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px dashed var(--line);font-weight:600}
    .line > span:first-child{color:var(--muted);font-weight:500}
    .total{font-family:'Bricolage Grotesque',sans-serif;font-size:34px;font-weight:800}
    label{display:block;font-weight:700;margin-bottom:6px}
    input[type=text],input[type=email]{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;margin-bottom:20px;background:#fff}
    input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(27,63,160,.15)}
    .note{font-size:14px;color:var(--muted);margin:14px 0 0}

    .ticket{max-width:520px;margin:0 auto;background:var(--white);border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:0 24px 50px -28px rgba(16,24,40,.45)}
    .ticket-head{background:var(--ok);color:#fff;padding:34px 28px;text-align:center}
    .ticket-head svg{width:64px;height:64px;margin-bottom:10px}
    .ticket-head h1{font-size:34px}
    .ticket-body{padding:26px 28px}
    .ticket dl{margin:0}
    .ticket .r{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed var(--line)}
    .ticket dt{color:var(--muted)}
    .ticket dd{margin:0;font-weight:700;text-align:right}
    .ticket .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
    .ticket .actions .btn{flex:1;text-align:center}
    .pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;background:#E7F5EE;color:var(--ok)}
    .pill.wait{background:#FDF1DC;color:var(--wait)}

    .stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px}
    .stat{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px 22px;min-width:170px}
    .stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:36px;line-height:1.1}
    .stat span{color:var(--muted);font-size:14px;font-weight:600}
    .table-wrap{overflow-x:auto;padding:0}
    table{width:100%;border-collapse:collapse;font-size:15px}
    th{background:var(--blue);color:#fff;text-align:left;padding:14px 16px;font-weight:600;white-space:nowrap}
    td{padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
    tr:last-child td{border-bottom:0}
    tbody tr:hover td{background:#F7F9FE}
    .num-r{text-align:right;font-variant-numeric:tabular-nums}
    .foot{text-align:center;color:var(--muted);font-size:13px;padding:0 24px 36px}

    @media (max-width:820px){
        .hero{padding-bottom:110px}
        .hero .wrap,.checkout{grid-template-columns:1fr}
        .pay-card{margin:10px auto 0;max-width:300px}
        .pay-card .num{font-size:16px}
        .nav a{padding:8px 10px}
    }
</style>
