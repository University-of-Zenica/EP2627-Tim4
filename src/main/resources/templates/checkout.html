<!DOCTYPE html>
<html lang="bs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style th:replace="~{fragments/style :: css}"></style>
    <title>Završetak narudžbe - BHPay</title>
</head>
<body>
<header class="topbar"><div class="wrap">
    <a class="logo" href="/"><i></i>BHPay</a>
    <nav class="nav"><a href="/">Prodavnica</a><a href="/admin/orders">Trgovac</a></nav>
</div></header>

<main class="wrap page">
    <h1>Završetak narudžbe</h1>
    <p class="lead">Provjerite narudžbu i unesite podatke za potvrdu.</p>

    <div class="checkout">
        <section class="panel summary" th:attr="data-cat=${product.category}">
            <div class="tile-top"><span th:text="${product.category}">Kategorija</span></div>
            <div class="inner">
                <h2 th:text="${product.name}">Proizvod</h2>
                <div class="line"><span>Prodaje</span><span th:text="${product.merchant.name}">Trgovac</span></div>
                <div class="line"><span>Grad</span><span th:text="${product.merchant.city}">Grad</span></div>
                <div class="line"><span>Za platiti</span><span class="total"><span th:text="${product.price}">0.00</span> KM</span></div>
            </div>
        </section>

        <section class="panel">
            <form action="/process-payment" method="POST">
                <input type="hidden" name="productId" th:value="${product.id}" />

                <label for="customerName">Ime i prezime</label>
                <input id="customerName" type="text" name="customerName" required placeholder="npr. Amina Memić" />

                <label for="customerEmail">Email</label>
                <input id="customerEmail" type="email" name="customerEmail" required placeholder="amina@unze.ba" />

                <button type="submit" class="btn block">Plati karticom</button>
                <p class="note">Ovo je simulacija plaćanja. Prava kartica se ne naplaćuje.</p>
            </form>
        </section>
    </div>
</main>
</body>
</html>
