<!DOCTYPE html>
<html lang="bs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style th:replace="~{fragments/style :: css}"></style>
    <title>Narudžbe trgovaca - BHPay</title>
</head>
<body>
<header class="topbar"><div class="wrap">
    <a class="logo" href="/"><i></i>BHPay</a>
    <nav class="nav"><a href="/">Prodavnica</a><a href="/admin/orders" aria-current="page">Trgovac</a></nav>
</div></header>

<main class="wrap page">
    <h1>Narudžbe</h1>
    <p class="lead">Pregled narudžbi svih trgovaca, s provizijom koju zadržava BHPay i iznosom za isplatu.</p>

    <div class="stats">
        <div class="stat"><b th:text="${#lists.size(orders)}">0</b><span>narudžbi</span></div>
    </div>

    <div class="panel table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th><th>Kupac</th><th>Email</th><th>Proizvod</th><th>Trgovac</th>
                <th class="num-r">Iznos (KM)</th><th class="num-r">Provizija (KM)</th><th class="num-r">Isplata (KM)</th><th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ord : ${orders}">
                <td th:text="${ord.id}">1</td>
                <td th:text="${ord.customerName}">Ime</td>
                <td th:text="${ord.customerEmail}">Email</td>
                <td th:text="${ord.productName}">Proizvod</td>
                <td th:text="${ord.merchant.name}">Trgovac</td>
                <td class="num-r" th:text="${ord.amount}">0.00</td>
                <td class="num-r" th:text="${ord.merchant.calculateCommission(ord.amount)}">0.00</td>
                <td class="num-r" th:text="${ord.merchant.calculateNetAmount(ord.amount)}">0.00</td>
                <td><span class="pill" th:classappend="${ord.status == 'PLACENO'} ? '' : 'wait'" th:text="${ord.status}">STATUS</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
